name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - name: Require the companion updater source
        shell: pwsh
        run: |
          if (-not (Test-Path ../rust-auto-updator/crates/rust-auto-updator/Cargo.toml)) {
            throw 'This local integration requires the rust-auto-updator workspace beside text-reader. Provision the companion source before standalone CI can run.'
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - run: cargo test --locked --all-targets -j 2
      - shell: pwsh
        run: ./scripts/package.ps1
      - shell: pwsh
        run: ./scripts/verify-artifact.ps1
      - shell: pwsh
        run: |
          ./scripts/capture.ps1 -Output .test-output/reader.png -Screen reader
          ./scripts/capture.ps1 -Output .test-output/settings.png -Screen settings
      - uses: actions/upload-artifact@v4
        with:
          name: TextReader-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

  localization-release:
    name: Publish the explicitly requested localization release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TextReader-Windows-x64
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
